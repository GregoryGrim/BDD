<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111111">
  <title>Гра починається</title>

  <style>
    /* =========================================
       ОСНОВНЕ ОФОРМЛЕННЯ САЙТУ
       Тут можна змінювати кольори та розміри
       ========================================= */

    :root {
      --background: #111111;
      --panel: #1c1c1c;
      --pink: #ed4775;
      --pink-hover: #ff5b88;
      --text: #ffffff;
      --muted: #b8b8b8;
      --button: #292929;
      --button-hover: #3a3a3a;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 28px 16px 40px;
      display: flex;
      justify-content: center;
      align-items: center;
      background:
        radial-gradient(circle at 50% 0%, rgba(237, 71, 117, 0.13), transparent 38%),
        var(--background);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      width: 100%;
      max-width: 430px;
      text-align: center;
    }

    .symbols {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 22px;
      margin-bottom: 30px;
    }

    .symbol-circle {
      width: 25px;
      height: 25px;
      border: 3px solid var(--pink);
      border-radius: 50%;
    }

    .symbol-triangle {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 27px solid var(--pink);
    }

    .symbol-square {
      width: 25px;
      height: 25px;
      border: 3px solid var(--pink);
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(27px, 7vw, 36px);
      letter-spacing: 3px;
      line-height: 1.2;
    }

    .intro {
      margin: 0 auto;
      max-width: 360px;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.65;
      white-space: pre-line;
    }

    .separator {
      width: 100%;
      height: 1px;
      margin: 30px 0;
      background: linear-gradient(90deg, transparent, #555555, transparent);
    }

    h2 {
      margin: 0 0 20px;
      font-size: 19px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .code-display {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 22px;
    }

    .code-digit {
      width: 55px;
      height: 62px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 1px solid #555555;
      border-radius: 8px;
      background: var(--panel);
      color: var(--text);
      font-size: 28px;
      font-weight: bold;
    }

    .code-digit.filled {
      border-color: var(--pink);
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      max-width: 265px;
      margin: 0 auto;
    }

    .key {
      min-height: 57px;
      border: 1px solid #3b3b3b;
      border-radius: 9px;
      background: var(--button);
      color: var(--text);
      font-size: 22px;
      cursor: pointer;
      transition: background 0.15s, transform 0.15s;
    }

    .key:hover {
      background: var(--button-hover);
    }

    .key:active {
      transform: scale(0.96);
    }

    .key.zero {
      grid-column: 2;
    }

    .key.action {
      color: var(--muted);
      font-size: 15px;
      font-weight: bold;
      letter-spacing: 0.5px;
    }

    .check-button {
      width: 100%;
      max-width: 265px;
      margin-top: 18px;
      padding: 15px 20px;
      border: none;
      border-radius: 8px;
      background: var(--pink);
      color: white;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .check-button:hover {
      background: var(--pink-hover);
    }

    .message {
      display: none;
      margin: 22px auto 0;
      padding: 20px;
      border: 1px solid #444444;
      border-left: 3px solid var(--pink);
      border-radius: 8px;
      background: var(--panel);
      text-align: left;
      line-height: 1.65;
      white-space: pre-line;
    }

    .message.visible {
      display: block;
    }

    .message-title {
      margin: 0 0 9px;
      color: var(--pink);
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .message-text {
      margin: 0;
      color: var(--text);
      font-size: 15px;
    }

    .error {
      min-height: 20px;
      margin: 13px 0 0;
      color: #ff829f;
      font-size: 13px;
    }

    @media (max-width: 360px) {
      .code-digit {
        width: 49px;
        height: 57px;
      }

      .keypad {
        max-width: 245px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <!-- =========================================
         ЛОГОТИП: КОЛО, ТРИКУТНИК І КВАДРАТ
         ========================================= -->
    <div class="symbols" aria-label="Коло, трикутник, квадрат">
      <div class="symbol-circle"></div>
      <div class="symbol-triangle"></div>
      <div class="symbol-square"></div>
    </div>

    <!-- =========================================
         ТУТ МОЖНА ЗМІНИТИ ЗАГОЛОВОК І ПРИВІТАННЯ
         ========================================= -->
    <h1>ГРА ПОЧИНАЄТЬСЯ</h1>

    <p class="intro">Вітаю у грі!
<BR> Потрібно трішки зачекати щоб отримати першу підказку, я скоро буду :)
<BR>
Збережи цю сторінку щоб потім вводити коди і дізнаватись перебіг гри</p>

    <div class="separator"></div>

    <h2>ВВЕДІТЬ ЧОТИРИЗНАЧНИЙ КОД</h2>

    <!-- ЧОТИРИ ПОЛЯ ДЛЯ ВІДОБРАЖЕННЯ ЦИФР -->
    <div class="code-display" aria-label="Введений код">
      <div class="code-digit" id="digit1"></div>
      <div class="code-digit" id="digit2"></div>
      <div class="code-digit" id="digit3"></div>
      <div class="code-digit" id="digit4"></div>
    </div>

    <!-- ЦИФРОВА КЛАВІАТУРА -->
    <div class="keypad">
      <button class="key" type="button" data-digit="1">1</button>
      <button class="key" type="button" data-digit="2">2</button>
      <button class="key" type="button" data-digit="3">3</button>
      <button class="key" type="button" data-digit="4">4</button>
      <button class="key" type="button" data-digit="5">5</button>
      <button class="key" type="button" data-digit="6">6</button>
      <button class="key" type="button" data-digit="7">7</button>
      <button class="key" type="button" data-digit="8">8</button>
      <button class="key" type="button" data-digit="9">9</button>

      <!-- Нижній ряд: очистити | 0 | видалити останню цифру -->
      <button class="key action" id="clearButton" type="button" aria-label="Очистити весь код">CLR</button>
      <button class="key zero" type="button" data-digit="0">0</button>
      <button class="key action" id="deleteButton" type="button" aria-label="Видалити останню цифру">⌫</button>
    </div>

    <button class="check-button" id="checkButton" type="button">
      ПЕРЕВІРИТИ КОД
    </button>

    <p class="error" id="errorMessage" aria-live="polite"></p>

    <!-- ТУТ З'ЯВЛЯТИМУТЬСЯ ПІДКАЗКИ -->
    <section class="message" id="hintBox" aria-live="polite">
      <p class="message-title">ВАША ПІДКАЗКА</p>
      <p class="message-text" id="hintText"></p>
    </section>

  </main>

  <script>
    // =====================================================
    // ТУТ МОЖНА ЗМІНИТИ П'ЯТЬ КОДІВ ТА ТЕКСТИ ПІДКАЗОК
    //
    // Заміни цифри та текст після двокрапки на свої.
    // Кожен код має складатися рівно з чотирьох цифр.
    // Можна використовувати цифру 0.
    // =====================================================

    const hints = {
      "1011": "Сьогодні нас чекає сніданок не вдома, орієнтуємось на 11-00.",
      "1609": "Тепер нас чекає фото-прогулянка і потрібно буде забрати щось смачненьке.",
	"0903": "Потрібно мене зачекати трохи, але поки ти будеш вдома - підготуй цукор та соду.",
      "2026": "Тепер можемо поглянути фото та пограти в ще одну гру, як будеш готова - скажи мені слово *картки*",
            "2002": "Ти пройшла всі етапи гри, але найкраще що ми не просто грали, а провели цей день разом. 
Тепер на нас чекає ще одна подорож, збираємось. "
    };

    // =====================================================
    // НИЖЧЕ РОЗТАШОВАНИЙ ТЕХНІЧНИЙ КОД.
    // Його змінювати не потрібно.
    // =====================================================

    let enteredCode = "";

    const digitBoxes = [
      document.getElementById("digit1"),
      document.getElementById("digit2"),
      document.getElementById("digit3"),
      document.getElementById("digit4")
    ];

    const hintBox = document.getElementById("hintBox");
    const hintText = document.getElementById("hintText");
    const errorMessage = document.getElementById("errorMessage");

    function updateDisplay() {
      digitBoxes.forEach((box, index) => {
        box.textContent = enteredCode[index] || "";
        box.classList.toggle("filled", Boolean(enteredCode[index]));
      });
    }

    function addDigit(digit) {
      if (enteredCode.length >= 4) return;

      enteredCode += digit;
      updateDisplay();

      errorMessage.textContent = "";
      hintBox.classList.remove("visible");
    }

    function deleteLastDigit() {
      enteredCode = enteredCode.slice(0, -1);
      updateDisplay();
      errorMessage.textContent = "";
      hintBox.classList.remove("visible");
    }

    function clearCode() {
      enteredCode = "";
      updateDisplay();
      errorMessage.textContent = "";
      hintBox.classList.remove("visible");
    }

    function checkCode() {
      if (enteredCode.length !== 4) {
        errorMessage.textContent = "Спочатку введіть усі чотири цифри.";
        hintBox.classList.remove("visible");
        return;
      }

      if (Object.prototype.hasOwnProperty.call(hints, enteredCode)) {
        hintText.textContent = hints[enteredCode];
        hintBox.classList.add("visible");
        errorMessage.textContent = "";
      } else {
        hintBox.classList.remove("visible");
        errorMessage.textContent = "НЕПРАВИЛЬНИЙ КОД. СПРОБУЙТЕ ЩЕ РАЗ.";
      }
    }

    document.querySelectorAll("[data-digit]").forEach(button => {
      button.addEventListener("click", () => {
        addDigit(button.dataset.digit);
      });
    });

    document.getElementById("clearButton").addEventListener("click", clearCode);
    document.getElementById("deleteButton").addEventListener("click", deleteLastDigit);
    document.getElementById("checkButton").addEventListener("click", checkCode);
  </script>
</body>
</html>
